services:
  backend:
    build: ./backend
    ports:
      - "7000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ig_sessions:/app/sessions
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "2000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ig_sessions:
